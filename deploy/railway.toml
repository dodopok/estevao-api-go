# Web service (Go). Shared variables: DATABASE_URL, REDIS_URL and the secrets
# (docs/OPERATIONS.md).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "estevao-api"
healthcheckPath = "/up"
healthcheckTimeout = 180
# Before the release takes traffic: `estevao db prepare` (rails db:prepare:
# create/load/seed a new database, otherwise apply pending migrations; a
# failed migration stops the deploy) and the calendar warm-up, which never
# fails.
preDeployCommand = "estevao db prepare && estevao-worker -warm-calendar"
restartPolicyType = "ON_FAILURE"
