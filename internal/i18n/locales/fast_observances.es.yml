      motives:
        ash_wednesday: Este día marca el comienzo de la Cuaresma, tiempo de preparación
          penitencial para la Pascua.
        good_friday: Este día recuerda la Pasión y la muerte de Jesucristo.
        lenten_weekday: En la Cuaresma, la Iglesia está invitada a profundizar la
          oración, el arrepentimiento y la preparación para la Pascua.
        wednesday: El miércoles recuerda la traición del Señor y, junto con el viernes,
          forma el ayuno semanal.
        friday: El viernes recuerda la crucifixión del Señor e invita a la oración
          y la renuncia.
        ember_day: Las Témporas son días de oración e intercesión, especialmente por
          los ministerios de la Iglesia.
        rogation_day: Las Rogativas son días de súplica y acción de gracias por el
          trabajo, la creación y las necesidades del mundo.
        vigil: La vigilia es un tiempo de preparación en la víspera de una fiesta.
        principal_feast_vigil: La vigilia prepara para la Fiesta Principal que se
          aproxima.
