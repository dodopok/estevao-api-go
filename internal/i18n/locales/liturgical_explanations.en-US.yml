        first_reading: "First reading"
        psalm: "Psalm"
        psalm_alternative: "Alternative psalm"
        second_reading: "Second reading"
        gospel: "Gospel"
    color_meanings:
      advent_violet: "Violet expresses watchful expectation, hope, and preparation for Christ's coming in Advent."
      christmas_white: "White or gold expresses the joy, light, and purity of celebrating Christ's birth."
      epiphany_green: "Green recalls the growth of faith as Christ's light is made known to the world."
      lent_purple: "Purple expresses penitence, self-examination, fasting, and preparation for Easter."
      easter_white: "White or gold celebrates the joy, light, and victory of Christ's resurrection."
      ordinary_green: "Green symbolizes hope and growth in faith and in the life of the Church during Ordinary Time."
      gaudete_rose: "Rose expresses the joy that begins to break through the waiting and preparation of Advent."
      laetare_rose: "Rose expresses a pause of joy and hope in the midst of Lenten penitence and preparation."
      holy_week_red: "Red accompanies Holy Week and recalls Christ's passion and his love poured out unto death."
      palm_sunday_red: "Red recalls Christ's entry into Jerusalem and the Passion proclaimed on the same day."
      good_friday_red: "Red recalls Christ's blood and his self-offering on the cross on Good Friday."
      good_friday_black: "Black expresses the Church's mourning and silence before Christ's death on Good Friday."
      maundy_thursday_white: "White expresses the joy and communion of the institution of the Eucharist on Maundy Thursday."
      easter_vigil_white: "White or gold announces the light, new life, and joy of the Resurrection celebrated at the Easter Vigil."
      holy_saturday_black: "Black expresses mourning, silence, and the Church's waiting beside Christ's tomb on Holy Saturday."
      ascension_white: "White or gold celebrates the glory of the risen Christ in his Ascension."
      pentecost_red: "Red represents the fire of the Holy Spirit and the power that sends the Church in mission at Pentecost."
      trinity_white: "White or gold celebrates the glory and fullness of the life of the Triune God on Trinity Sunday."
      all_saints_white: "White or gold expresses the joy and holiness celebrated on All Saints' Day."
      celebration_martyr_red: "Red recalls the blood shed and the faithful witness of the martyrs."
      celebration_apostle_red: "Red recalls the fire of the Holy Spirit and the missionary witness of the apostles and evangelists."
      celebration_white: "White or gold expresses joy, light, purity, and holiness in the celebration."
      celebration_red: "Red associates the celebration with the fire of the Holy Spirit, Christ's blood, and Christian witness."
      celebration_penitential: "Purple/violet expresses penitence, prayer, and preparation for the celebration."
      celebration_rose: "Rose signals joy and hope in the midst of a time of preparation or penitence."
      celebration_green: "Green symbolizes hope and growth in faith."
      celebration_black: "Black expresses mourning, solemnity, and silence before death."
      generic_white: "White or gold expresses joy, light, purity, and new life."
      generic_red: "Red recalls the fire of the Holy Spirit, Christ's blood, and the witness of faith."
      generic_penitential: "Purple/violet expresses penitence, prayer, and preparation."
      generic_rose: "Rose signals joy and hope in the midst of preparation or penitence."
      generic_green: "Green symbolizes hope and growth in faith."
      generic_black: "Black expresses mourning, solemnity, and silence."
      generic_color: "The liturgical color communicates the predominant spiritual theme of the celebration."
      advent_blue: "Blue is the Sarum colour of Advent: the blue of daybreak and of the hope of Christ's coming, kept where the Roman use keeps violet."
      celebration_blue: "Blue expresses hope and expectation, and the honour paid to the Blessed Virgin Mary."
      generic_blue: "Blue expresses hope, expectation, and the light that is coming."
