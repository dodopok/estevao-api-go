  liturgical:
    season_meanings:
      advent: "Advent opens the year in watchful waiting: for Christ's coming at Bethlehem, and for his coming again in glory."
      christmastide: "Christmastide keeps the Twelve Days of the Nativity, from Christmas Day to the eve of the Epiphany."
      epiphanytide: "Epiphanytide follows the showing forth of Christ to the nations, from the Epiphany until Septuagesima."
      septuagesimatide: "Septuagesimatide is the fore-Lent: three Sundays in which the Church lays aside the Alleluia and turns towards the fast."
      lent: "Lent is the forty days' fast, kept in prayer, abstinence and almsgiving in preparation for Easter."
      passiontide: "Passiontide is the last fortnight of Lent, from Passion Sunday, when the Church fixes her gaze on the Cross."
      triduum: "The Sacred Triduum is the three days from Mattins of Maundy Thursday to the eve of Easter, in which the Church keeps the Lord's supper, passion and burial."
      eastertide: "Eastertide is the great fifty days, from Easter Day, in which the Church keeps the Resurrection as one continuous feast."
      ascensiontide: "Ascensiontide runs from the Ascension to the eve of Whitsunday, while the Church waits for the promise of the Father."
      whitsuntide: "Whitsuntide keeps the coming of the Holy Ghost at Pentecost and the octave that follows it."
      trinitytide: "Trinitytide is the long season after Trinity Sunday, in which the Church grows in the faith she has confessed."
    presentation:
      day:
        title: "%{celebration}"
        summary: "We are in %{season}, in cycle %{cycle}."
      season_range:
