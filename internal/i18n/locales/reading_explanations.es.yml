        proper: { title: "Lecturas del propio", summary: "El propio numerado de este domingo determina estas lecturas." }
        sunday: { title: "Lecturas del domingo", summary: "El ciclo dominical determina estas lecturas." }
        civil_date: { title: "Lecturas de la fecha", summary: "La entrada del leccionario para esta fecha determina estas lecturas." }
        office_fallback: { title: "Lecturas del Oficio Diario", summary: "Este Libro de Oración no tiene leccionario eucarístico para este caso; se aplica el curso del Oficio Diario." }
