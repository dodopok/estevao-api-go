es:
  reading:
    presentation:
      cycle:
        a: { title: "Año A del ciclo dominical", summary: "Estamos en el Año A de la rotación dominical de tres años: A, B y C." }
        b: { title: "Año B del ciclo dominical", summary: "Estamos en el Año B de la rotación dominical de tres años: A, B y C." }
        c: { title: "Año C del ciclo dominical", summary: "Estamos en el Año C de la rotación dominical de tres años: A, B y C." }
        odd: { title: "Año I del ciclo bienal", summary: "Estas lecturas siguen el primer año de la rotación de dos años." }
        even: { title: "Año II del ciclo bienal", summary: "Estas lecturas siguen el segundo año de la rotación de dos años." }
        other: { title: "Ciclo de lecturas", summary: "Este conjunto sigue el ciclo definido por este Libro de Oración." }
      track:
        semicontinuous: { title: "Pista semicontinua", summary: "Las lecturas siguen una secuencia de textos bíblicos a lo largo de las semanas." }
        complementary: { title: "Pista complementaria", summary: "Las lecturas se eligen para relacionarse temáticamente con el domingo y las demás lecturas." }
      psalter:
        appointed: { title: "Salmos designados", summary: "Elegiste los Salmos designados por el leccionario de este Libro de Oración." }
        monthly: { title: "Salterio de treinta días", summary: "Elegiste el Salterio de treinta días; los Salmos de este día se dividen entre la Oración Matutina y la Oración Vespertina." }
      method:
        principal_celebration: { title: "Lecturas de la celebración principal", summary: "La celebración principal del día determina estas lecturas." }
