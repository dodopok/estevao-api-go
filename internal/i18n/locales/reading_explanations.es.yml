        festival: { title: "Lecturas del festival", summary: "El festival celebrado hoy determina estas lecturas." }
        preparation: { title: "Lecturas de preparación", summary: "Estas lecturas preparan a la comunidad para el domingo siguiente." }
        weekly_reflection: { title: "Lecturas de reflexión", summary: "Estas lecturas retoman y profundizan el domingo anterior." }
        daily_course: { title: "Lecturas del curso diario", summary: "Estas lecturas siguen el curso diario ordinario." }
        vigil: { title: "Lecturas de vigilia", summary: "Estas lecturas están designadas para la vigilia de la celebración siguiente." }
        minor_celebration: { title: "Lecturas de la celebración del día", summary: "La celebración del calendario determina estas lecturas." }
