        discipline_and_self_denial: Discipline and self-denial
        abstinence: Abstinence
      motives:
        ash_wednesday: This day begins Lent, a season of penitential preparation for
          Easter.
        good_friday: This day recalls the Passion and death of Jesus Christ.
        lenten_weekday: In Lent, the Church is invited to deepen prayer, repentance,
          and preparation for Easter.
        wednesday: Wednesday recalls the betrayal of the Lord, and is kept with Friday
          as a weekly fast.
        friday: Friday recalls the Lord's crucifixion and invites prayer and self-denial.
        ember_day: The Ember Days are days of prayer and intercession, especially
          for the ministries of the Church.
        rogation_day: The Rogation Days are days of supplication and thanksgiving
          for work, creation, and the needs of the world.
        vigil: The vigil is a time of preparation on the eve of a feast.
        principal_feast_vigil: The vigil prepares for the approaching Principal Feast.
