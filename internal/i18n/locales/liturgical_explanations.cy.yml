  liturgical:
    explanations:
      no_celebration: "Ni phenodwyd dathliad ar gyfer y dyddiad hwn."
      only_candidate: "Hwn oedd yr unig ddathliad a benodwyd ar gyfer y dyddiad."
      principal_feast: "Mae prif ŵyl yn cael blaenoriaeth dros yr ymgeiswyr eraill."
      major_holy_day: "Mae dydd gŵyl mawr yn cael blaenoriaeth dros yr ymgeiswyr eraill."
      sunday_in_major_season: "Mae cadw'r Sul yn y tymor litwrgaidd yn cael blaenoriaeth."
      lowest_rank: "Dewiswyd yr ymgeisydd â'r flaenoriaeth litwrgaidd uchaf."
      annunciation_protected_period: "Trosglwyddwyd y Cyfarchiad y tu hwnt i gyfnod gwarchodedig y Pasg."
      protected_period: "Trosglwyddwyd y dathliad am fod ei ddyddiad gwreiddiol mewn cyfnod gwarchodedig."
      sunday_conflict: "Trosglwyddwyd y dathliad am fod ei ddyddiad gwreiddiol yn syrthio ar ddydd Sul."
      all_saints_observance: "Cadwyd Gŵyl yr Holl Saint ar y Sul a ganiateir."
      calendar_conflict: "Trosglwyddwyd y dathliad oherwydd gwrthdaro yn y calendr."
      principal_celebration_overrides_season: "Mae lliw y prif ddathliad yn cymryd blaenoriaeth dros liw'r tymor."
      sunday_uses_season_color: "Mae'r Sul yn defnyddio lliw'r tymor litwrgaidd."
      weekday_celebration_color: "Mae'r diwrnod gwaith yn defnyddio'r lliw a benodwyd ar gyfer y dathliad."
      season_color: "Daw'r lliw o'r tymor litwrgaidd."
    color_meanings:
      advent_violet: "Mae porffor yn mynegi disgwyliad gwyliadwrus, gobaith a pharatoi ar gyfer dyfodiad Crist yn yr Adfent."
      christmas_white: "Mae gwyn neu aur yn mynegi llawenydd, goleuni a phurdeb dathlu genedigaeth Crist."
      epiphany_green: "Mae gwyrdd yn ein hatgoffa o dwf ffydd wrth i oleuni Crist gael ei amlygu i'r byd."
      lent_purple: "Mae porffor yn mynegi edifeirwch, hunanarchwiliad, ympryd a pharatoi ar gyfer y Pasg."
      easter_white: "Mae gwyn neu aur yn dathlu llawenydd, goleuni a buddugoliaeth atgyfodiad Crist."
      ordinary_green: "Mae gwyrdd yn symbol o obaith a thwf mewn ffydd ac ym mywyd yr Eglwys yn ystod Amser Cyffredin."
      gaudete_rose: "Mae pinc yn mynegi'r llawenydd sy'n dechrau torri trwy ddisgwyl a pharatoi'r Adfent."
      laetare_rose: "Mae pinc yn mynegi saib o lawenydd a gobaith yng nghanol edifeirwch a pharatoi'r Grawys."
      holy_week_red: "Mae coch yn cyd-fynd â'r Wythnos Fawr ac yn dwyn i gof ddioddefaint Crist a'i gariad a dywalltwyd hyd angau."
      palm_sunday_red: "Mae coch yn dwyn i gof ddyfodiad Crist i Jerwsalem a'r Dioddefaint a gyhoeddir ar yr un dydd."
      good_friday_red: "Mae coch yn dwyn i gof waed Crist a'i hunanoffrwm ar y groes ar Ddydd Gwener y Groglith."
      good_friday_black: "Mae du yn mynegi galar a distawrwydd yr Eglwys gerbron marwolaeth Crist ar Ddydd Gwener y Groglith."
      maundy_thursday_white: "Mae gwyn yn mynegi llawenydd a chymundeb sefydlu'r Ewcharist ar Ddydd Iau Cablyd."
      easter_vigil_white: "Mae gwyn neu aur yn cyhoeddi goleuni, bywyd newydd a llawenydd yr Atgyfodiad a ddethlir yng Ngwylnos y Pasg."
      holy_saturday_black: "Mae du yn mynegi galar, distawrwydd a disgwyliad yr Eglwys wrth fedd Crist ar Ddydd Sadwrn Sanctaidd."
      ascension_white: "Mae gwyn neu aur yn dathlu gogoniant Crist atgyfodedig yn ei Ddyrchafael."
      pentecost_red: "Mae coch yn cynrychioli tân yr Ysbryd Glân a'r nerth sy'n anfon yr Eglwys ar genhadaeth yn y Pentecost."
      trinity_white: "Mae gwyn neu aur yn dathlu gogoniant a chyflawnder bywyd y Duw Tri-yn-Un ar Sul y Drindod."
      all_saints_white: "Mae gwyn neu aur yn mynegi'r llawenydd a'r sancteiddrwydd a ddethlir ar Ŵyl yr Holl Saint."
      celebration_martyr_red: "Mae coch yn dwyn i gof y gwaed a dywalltwyd a thystiolaeth ffyddlon y merthyron."
      celebration_apostle_red: "Mae coch yn dwyn i gof dân yr Ysbryd Glân a thystiolaeth genhadol yr apostolion a'r efengylwyr."
      celebration_white: "Mae gwyn neu aur yn mynegi llawenydd, goleuni, purdeb a sancteiddrwydd yn y dathliad."
      celebration_red: "Mae coch yn cysylltu'r dathliad â thân yr Ysbryd Glân, gwaed Crist a thystiolaeth Gristnogol."
      celebration_penitential: "Mae porffor yn mynegi edifeirwch, gweddi a pharatoi ar gyfer y dathliad."
      celebration_rose: "Mae pinc yn arwyddo llawenydd a gobaith yng nghanol amser o baratoi neu edifeirwch."
      celebration_green: "Mae gwyrdd yn symbol o obaith a thwf mewn ffydd."
      celebration_black: "Mae du yn mynegi galar, difrifoldeb a distawrwydd gerbron marwolaeth."
      generic_white: "Mae gwyn neu aur yn mynegi llawenydd, goleuni, purdeb a bywyd newydd."
      generic_red: "Mae coch yn dwyn i gof dân yr Ysbryd Glân, gwaed Crist a thystiolaeth ffydd."
      generic_penitential: "Mae porffor yn mynegi edifeirwch, gweddi a pharatoi."
      generic_rose: "Mae pinc yn arwyddo llawenydd a gobaith yng nghanol paratoi neu edifeirwch."
      generic_green: "Mae gwyrdd yn symbol o obaith a thwf mewn ffydd."
      generic_black: "Mae du yn mynegi galar, difrifoldeb a distawrwydd."
      generic_color: "Mae'r lliw litwrgaidd yn cyfleu prif thema ysbrydol y dathliad."
      advent_blue: "Glas yw lliw Sarum ar gyfer yr Adfent: glas y wawr a gobaith dyfodiad Crist, a gedwir lle mae'r defnydd Rhufeinig yn cadw fioled."
      celebration_blue: "Mae glas yn mynegi gobaith a disgwyliad, a'r anrhydedd a roddir i'r Fendigaid Forwyn Fair."
      generic_blue: "Mae glas yn mynegi gobaith, disgwyliad a'r goleuni sydd i ddod."
    season_meanings:
      advent: "Mae'r Adfent yn agor y flwyddyn mewn disgwyl gwyliadwrus: am ddyfodiad Crist ym Methlehem, ac am ei ddyfodiad eto mewn gogoniant."
      christmastide: "Mae Tymor y Nadolig yn cadw Deuddeg Dydd y Genedigaeth, o Ddydd Nadolig hyd noswyl yr Ystwyll."
      epiphanytide: "Mae Tymor yr Ystwyll yn dilyn amlygiad Crist i'r cenhedloedd, o'r Ystwyll hyd y Septuagesima."
      septuagesimatide: "Y Septuagesima yw'r rhag-Grawys: tri Sul pan fydd yr Eglwys yn gosod yr Aleliwia o'r neilltu ac yn troi at yr ympryd."
      lent: "Y Grawys yw ympryd y deugain diwrnod, a gedwir mewn gweddi, ymataliaeth ac elusen wrth baratoi at y Pasg."
      passiontide: "Tymor y Dioddefaint yw pythefnos olaf y Grawys, o Sul y Dioddefaint, pan fydd yr Eglwys yn hoelio ei golwg ar y Groes."
      triduum: "Y Triduum Sanctaidd yw'r tridiau o Foreol Weddi Dydd Iau Cablyd hyd noswyl y Pasg, pan fydd yr Eglwys yn cadw swper, dioddefaint a chladdedigaeth yr Arglwydd."
      eastertide: "Tymor y Pasg yw'r hanner cant o ddyddiau mawr, o Ddydd y Pasg, pan fydd yr Eglwys yn cadw'r Atgyfodiad fel un wledd barhaus."
      ascensiontide: "Mae Tymor y Dyrchafael yn rhedeg o'r Dyrchafael hyd noswyl y Sulgwyn, tra bo'r Eglwys yn disgwyl addewid y Tad."
      whitsuntide: "Mae Tymor y Sulgwyn yn cadw dyfodiad yr Ysbryd Glân ar y Pentecost a'r wythnos sy'n dilyn."
      trinitytide: "Tymor y Drindod yw'r tymor hir ar ôl Sul y Drindod, pan fydd yr Eglwys yn tyfu yn y ffydd a gyffesodd."
