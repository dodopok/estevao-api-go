      statuses:
        appointed: Este Livro de Oração estabelece esta observância para o dia.
        traditional: Neste Livro de Oração, esta é apresentada como uma prática tradicional
          para o dia.
        encouraged: Este Livro de Oração recomenda esta prática para o dia.
        optional: Este Livro de Oração oferece esta prática como opção para o dia.
        obligatory: A disciplina eclesial aplicável considera esta prática obrigatória
          neste dia.
      meanings:
        fast: Em geral, o jejum implica limitar a alimentação durante um período,
          como auxílio à oração; a forma concreta varia consoante o livro e a orientação
          da igreja local.
        total_abstinence: A abstinência consiste em renunciar a algo determinado pela
          tradição. Quando o livro fala de abstinência total, a renúncia é completa
          em relação ao que especifica; a aplicação concreta segue essa tradição.
        special_devotion_and_total_abstinence: Este dia combina devoção especial com
          abstinência total. A forma concreta da abstinência segue o que este livro
          e a igreja local determinam.
        fast_and_abstinence: Em geral, o jejum implica limitar a alimentação durante
          um período, enquanto a abstinência implica renunciar a algo específico.
          As regras concretas variam consoante o livro e a orientação da igreja local.
        fast_and_total_abstinence: Este dia reúne jejum e abstinência total. A forma
          concreta de os praticar segue o que este livro e a igreja local determinam.
        fasting_or_abstinence: 'O livro deixa a forma em aberto: o dia pode ser observado
          com jejum ou abstinência. Em ambos os casos, trata-se de uma prática de
          oração e renúncia.'
        fasting_with_abstinence: O livro associa um período de jejum à abstinência
          de algo que determina.
        special_devotion: Não é necessariamente um dia de jejum, mas um convite a
          reservar atenção especial à oração e à devoção.
        discipline_and_conversion: É um tempo para se voltar continuamente para Deus
          por meio da oração, do arrependimento e da mudança de vida.
        discipline_and_self_denial: É um convite à abnegação — abrir mão de algo por
          amor a Deus e ao próximo — unido à oração.
        abstinence: A abstinência é a renúncia a algo determinado, como alimento,
          bebida ou outro hábito, por motivo espiritual. A regra exata varia consoante
          o livro.
      badge_labels:
        fast: Jejum
        total_abstinence: Abstinência total
