    color_meanings:
      advent_violet: "El violeta expresa la espera vigilante, la esperanza y la preparación para la venida de Cristo en Adviento."
      christmas_white: "El blanco o dorado expresa la alegría, la luz y la pureza de celebrar el nacimiento de Cristo."
      epiphany_green: "El verde recuerda el crecimiento de la fe mientras la luz de Cristo se manifiesta al mundo."
      lent_purple: "El morado expresa penitencia, examen de conciencia, ayuno y preparación para la Pascua."
      easter_white: "El blanco o dorado celebra la alegría, la luz y la victoria de la resurrección de Cristo."
      ordinary_green: "El verde simboliza esperanza y crecimiento en la fe y en la vida de la Iglesia durante el Tiempo Ordinario."
      gaudete_rose: "El rosa expresa la alegría que comienza a surgir en medio de la espera y preparación del Adviento."
      laetare_rose: "El rosa expresa una pausa de alegría y esperanza en medio de la penitencia y preparación de la Cuaresma."
      holy_week_red: "El rojo acompaña la Semana Santa y recuerda la pasión de Cristo y su amor entregado hasta la muerte."
      palm_sunday_red: "El rojo recuerda la entrada de Cristo en Jerusalén y la Pasión proclamada ese mismo día."
      good_friday_red: "El rojo recuerda la sangre de Cristo y su entrega en la cruz el Viernes Santo."
      good_friday_black: "El negro expresa el duelo y el silencio de la Iglesia ante la muerte de Cristo el Viernes Santo."
      maundy_thursday_white: "El blanco expresa la alegría y la comunión de la institución de la Eucaristía el Jueves Santo."
      easter_vigil_white: "El blanco o dorado anuncia la luz, la vida nueva y la alegría de la Resurrección celebrada en la Vigilia Pascual."
      holy_saturday_black: "El negro expresa el duelo, el silencio y la espera de la Iglesia junto al sepulcro de Cristo el Sábado Santo."
      ascension_white: "El blanco o dorado celebra la gloria de Cristo resucitado en su Ascensión."
      pentecost_red: "El rojo representa el fuego del Espíritu Santo y su fuerza, que envía a la Iglesia en misión en Pentecostés."
      trinity_white: "El blanco o dorado celebra la gloria y la plenitud de la vida del Dios Trino en la Santísima Trinidad."
      all_saints_white: "El blanco o dorado expresa la alegría y la santidad celebradas en Todos los Santos."
      celebration_martyr_red: "El rojo recuerda la sangre derramada y el testimonio fiel de los mártires."
      celebration_apostle_red: "El rojo recuerda el fuego del Espíritu Santo y el testimonio misionero de los apóstoles y evangelistas."
      celebration_white: "El blanco o dorado expresa alegría, luz, pureza y santidad en la celebración."
      celebration_red: "El rojo asocia la celebración con el fuego del Espíritu Santo, la sangre de Cristo y el testimonio cristiano."
      celebration_penitential: "El morado/violeta expresa penitencia, oración y preparación para la celebración."
      celebration_rose: "El rosa señala alegría y esperanza en medio de un tiempo de preparación o penitencia."
      celebration_green: "El verde simboliza esperanza y crecimiento en la fe."
      celebration_black: "El negro expresa duelo, sobriedad y silencio ante la muerte."
      generic_white: "El blanco o dorado expresa alegría, luz, pureza y vida nueva."
      generic_red: "El rojo recuerda el fuego del Espíritu Santo, la sangre de Cristo y el testimonio de la fe."
      generic_penitential: "El morado/violeta expresa penitencia, oración y preparación."
      generic_rose: "El rosa señala alegría y esperanza en medio de la preparación o penitencia."
      generic_green: "El verde simboliza esperanza y crecimiento en la fe."
      generic_black: "El negro expresa duelo, sobriedad y silencio."
      generic_color: "El color litúrgico comunica el tema espiritual predominante de la celebración."
      advent_blue: "El azul es el color de Sarum para el Adviento: el azul del amanecer y de la esperanza en la venida de Cristo, guardado donde el uso romano guarda el violeta."
      celebration_blue: "El azul expresa esperanza y expectación, y el honor rendido a la Bienaventurada Virgen María."
      generic_blue: "El azul expresa esperanza, expectación y la luz que se acerca."
