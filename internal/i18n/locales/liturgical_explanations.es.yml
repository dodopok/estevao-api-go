es:
  date:
    formats:
      liturgical: "%d/%m/%Y"
  liturgical:
    season_meanings:
      advent: "El Adviento abre el año en la vigilia de la espera: de la venida de Cristo en Belén y de su venida otra vez en gloria."
      christmastide: "El Tiempo de Navidad guarda los Doce Días de la Natividad, del día de Navidad a la víspera de la Epifanía."
      epiphanytide: "El Tiempo de Epifanía acompaña la manifestación de Cristo a las naciones, desde la Epifanía hasta la Septuagésima."
      septuagesimatide: "La Septuagésima es la pre-Cuaresma: tres domingos en que la Iglesia depone el Aleluya y se vuelve hacia el ayuno."
      lent: "La Cuaresma es el ayuno de cuarenta días, guardado en oración, abstinencia y limosna, como preparación para la Pascua."
      passiontide: "El Tiempo de Pasión son las dos últimas semanas de Cuaresma, desde el Domingo de Pasión, cuando la Iglesia fija la mirada en la Cruz."
      triduum: "El Triduo Sacro son los tres días, desde Maitines del Jueves Santo hasta la víspera de Pascua, en que la Iglesia guarda la cena, la pasión y la sepultura del Señor."
      eastertide: "El Tiempo Pascual son los cincuenta grandes días, desde el día de Pascua, en que la Iglesia guarda la Resurrección como una fiesta continua."
      ascensiontide: "El Tiempo de la Ascensión va de la Ascensión a la víspera de Pentecostés, mientras la Iglesia aguarda la promesa del Padre."
      whitsuntide: "El Tiempo de Pentecostés guarda la venida del Espíritu Santo y la octava que le sigue."
      trinitytide: "El Tiempo después de Trinidad es la larga estación tras el Domingo de la Santísima Trinidad, en que la Iglesia crece en la fe que ha confesado."
