      motives:
        ash_wednesday: Este dia marca o início da Quaresma, tempo de preparação penitencial
          para a Páscoa.
        good_friday: Este dia recorda a Paixão e a morte de Jesus Cristo.
        lenten_weekday: Na Quaresma, a Igreja é convidada a aprofundar a oração, o
          arrependimento e a preparação para a Páscoa.
        wednesday: A quarta-feira recorda a traição do Senhor e, com a sexta-feira,
          forma o jejum semanal.
        friday: A sexta-feira recorda a crucificação do Senhor e convida à oração
          e à renúncia.
        ember_day: As Têmporas são dias de oração e intercessão, especialmente pelos
          ministérios da Igreja.
        rogation_day: As Rogações são dias de súplica e gratidão pelo trabalho, pela
          criação e pelas necessidades do mundo.
        vigil: A vigília é um tempo de preparação, na véspera de uma festa.
        principal_feast_vigil: A vigília prepara para a festa principal que se aproxima.
