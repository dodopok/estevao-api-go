  liturgical:
    explanations:
      no_celebration: "Não há celebração indicada para esta data."
      only_candidate: "Esta é a única celebração indicada para a data."
      principal_feast: "Uma festa principal tem precedência sobre as restantes candidatas."
      major_holy_day: "Um dia santo maior tem precedência sobre as restantes candidatas."
      sunday_in_major_season: "A observância dominical do tempo litúrgico tem precedência."
      lowest_rank: "Foi selecionada a candidata com maior precedência litúrgica."
      annunciation_protected_period: "A Anunciação foi transferida para depois do período protegido da Páscoa."
      protected_period: "A celebração foi transferida porque a sua data original ocorre num período protegido."
      sunday_conflict: "A celebração foi transferida porque a sua data original ocorre num domingo."
      all_saints_observance: "Todos os Santos foi celebrado no domingo permitido."
      calendar_conflict: "A celebração foi transferida devido a um conflito no calendário."
      principal_celebration_overrides_season: "A cor da celebração principal prevalece sobre a cor do tempo."
      sunday_uses_season_color: "O domingo usa a cor do tempo litúrgico."
      weekday_celebration_color: "O dia de semana usa a cor indicada para a celebração."
      season_color: "A cor provém do tempo litúrgico."
    color_meanings:
      advent_violet: "O violeta exprime a expectativa vigilante, a esperança e a preparação para a vinda de Cristo no Advento."
      christmas_white: "O branco ou dourado exprime a alegria, a luz e a pureza da celebração do nascimento de Cristo."
      epiphany_green: "O verde recorda o crescimento da fé à medida que a luz de Cristo se manifesta ao mundo."
      lent_purple: "O roxo exprime penitência, exame de consciência, jejum e preparação para a Páscoa."
      easter_white: "O branco ou dourado celebra a alegria, a luz e a vitória da ressurreição de Cristo."
      ordinary_green: "O verde simboliza a esperança e o crescimento na fé e na vida da Igreja durante o Tempo Comum."
      gaudete_rose: "O rosa exprime a alegria que começa a surgir no meio da espera e da preparação do Advento."
      laetare_rose: "O rosa exprime uma pausa de alegria e esperança no meio da penitência e da preparação da Quaresma."
      holy_week_red: "O vermelho acompanha a Semana Santa e recorda a paixão de Cristo e o seu amor entregue até à morte."
      palm_sunday_red: "O vermelho recorda a entrada de Cristo em Jerusalém e a Paixão proclamada no mesmo dia."
      good_friday_red: "O vermelho recorda o sangue de Cristo e a sua entrega na cruz na Sexta-feira da Paixão."
      good_friday_black: "O preto exprime o luto e o silêncio da Igreja diante da morte de Cristo na Sexta-feira da Paixão."
      maundy_thursday_white: "O branco exprime a alegria e a comunhão da instituição da Eucaristia na Quinta-feira Santa."
      easter_vigil_white: "O branco ou dourado anuncia a luz, a vida nova e a alegria da Ressurreição celebrada na Vigília Pascal."
      holy_saturday_black: "O preto exprime o luto, o silêncio e a espera da Igreja junto ao túmulo de Cristo no Sábado Santo."
      ascension_white: "O branco ou dourado celebra a glória de Cristo ressuscitado na sua Ascensão."
      pentecost_red: "O vermelho representa o fogo do Espírito Santo e a sua força, que envia a Igreja em missão no Pentecostes."
      trinity_white: "O branco ou dourado celebra a glória e a plenitude da vida do Deus Trino na Santíssima Trindade."
      all_saints_white: "O branco ou dourado exprime a alegria e a santidade celebradas no dia de Todos os Santos."
      celebration_martyr_red: "O vermelho recorda o sangue derramado e o testemunho fiel dos mártires."
      celebration_apostle_red: "O vermelho recorda o fogo do Espírito Santo e o testemunho missionário dos apóstolos e evangelistas."
      celebration_white: "O branco ou dourado exprime a alegria, a luz, a pureza e a santidade da celebração."
      celebration_red: "O vermelho associa a celebração ao fogo do Espírito Santo, ao sangue de Cristo e ao testemunho cristão."
      celebration_penitential: "O roxo/violeta exprime penitência, oração e preparação para a celebração."
      celebration_rose: "O rosa assinala alegria e esperança no meio de um tempo de preparação ou penitência."
      celebration_green: "O verde simboliza a esperança e o crescimento na fé."
      celebration_black: "O preto exprime o luto, a sobriedade e o silêncio diante da morte."
      generic_white: "O branco ou dourado exprime alegria, luz, pureza e vida nova."
      generic_red: "O vermelho recorda o fogo do Espírito Santo, o sangue de Cristo e o testemunho da fé."
      generic_penitential: "O roxo/violeta exprime penitência, oração e preparação."
      generic_rose: "O rosa assinala alegria e esperança no meio da preparação ou penitência."
      generic_green: "O verde simboliza a esperança e o crescimento na fé."
      generic_black: "O preto exprime o luto, a sobriedade e o silêncio."
      generic_color: "A cor litúrgica comunica o tema espiritual predominante da celebração."
      advent_blue: "O azul é a cor de Sarum para o Advento: o azul da madrugada e da esperança na vinda de Cristo, guardado onde o uso romano guarda o violeta."
      celebration_blue: "O azul exprime esperança e expectativa, e a honra prestada à Bem-Aventurada Virgem Maria."
      generic_blue: "O azul exprime esperança, expectativa e a luz que se aproxima."
    season_meanings:
      advent: "O Advento abre o ano na vigília da espera: da vinda de Cristo em Belém e de sua vinda outra vez em glória."
      christmastide: "O Tempo do Natal guarda os Doze Dias da Natividade, do dia de Natal à véspera da Epifania."
      epiphanytide: "O Tempo da Epifania acompanha a manifestação de Cristo às nações, da Epifania até a Septuagésima."
      septuagesimatide: "A Septuagésima é a pré-Quaresma: três domingos em que a Igreja depõe o Aleluia e se volta para o jejum."
      lent: "A Quaresma é o jejum de quarenta dias, guardado em oração, abstinência e esmola, como preparação para a Páscoa."
      passiontide: "O Tempo da Paixão são as duas últimas semanas da Quaresma, a partir do Domingo da Paixão, quando a Igreja fixa o olhar na Cruz."
      triduum: "O Tríduo Sacro são os três dias, das Matinas da Quinta-feira Santa à véspera da Páscoa, em que a Igreja guarda a ceia, a paixão e a sepultura do Senhor."
      eastertide: "O Tempo Pascal são os cinquenta grandes dias, desde o dia da Páscoa, em que a Igreja guarda a Ressurreição como uma festa contínua."
      ascensiontide: "O Tempo da Ascensão vai da Ascensão à véspera de Pentecostes, enquanto a Igreja aguarda a promessa do Pai."
      whitsuntide: "O Tempo de Pentecostes guarda a vinda do Espírito Santo e a oitava que a segue."
      trinitytide: "O Tempo depois de Trindade é a longa estação após o Domingo da Santíssima Trindade, em que a Igreja cresce na fé que confessou."
