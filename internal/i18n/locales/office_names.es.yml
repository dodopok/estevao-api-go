    office_names:
      standard:
        morning: Mañana
        midday: Mediodía
        evening: Tarde
        compline: Completas
        prime: Prima
        terce: Tercia
        none: Nona
      family:
        morning: Mañana
        midday: Mediodía
        evening: Tarde
        compline: Completas
