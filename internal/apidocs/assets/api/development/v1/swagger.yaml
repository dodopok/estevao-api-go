---
openapi: 3.0.1
info:
  title: API - Calendário Litúrgico Anglicano
  version: v1
  description: API para consulta de calendário litúrgico anglicano, lecionário, celebrações
    e ofício diário. Inclui autenticação Firebase para recursos personalizados.
paths:
  "/api/v1/background_music/home":
    get:
      summary: Get background music home
      tags:
      - Background Music
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: date
        in: query
        format: date
        required: false
        schema:
          type: string
      - name: office_type
        in: query
        required: false
        schema:
          type: string
      - name: prayer_book_code
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  recommendation:
                    type: object
                    nullable: true
                  categories:
                    type: array
                    items:
                      type: object
                  favorites:
                    type: array
                    items:
                      type: object
                  catalog_version:
                    type: string
        '401':
          description: unauthorized
        '403':
          description: premium required
  "/api/v1/background_music/tracks":
    get:
      summary: List background music tracks
      tags:
      - Background Music
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: date
        in: query
        format: date
        required: false
        schema:
          type: string
      - name: office_type
        in: query
        required: false
        schema:
          type: string
      - name: prayer_book_code
        in: query
        required: false
        schema:
          type: string
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: kind
        in: query
        required: false
        enum:
        - instrumental
        - chant
        - choral
        schema:
          type: string
        description: ":\n * `instrumental` \n * `chant` \n * `choral` \n "
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: favorites
        in: query
        required: false
        schema:
          type: boolean
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  tracks:
                    type: array
                    items:
                      type: object
                  next_cursor:
                    type: string
                    nullable: true
                  catalog_version:
                    type: string
  "/api/v1/background_music/tracks/{id}/playback":
    post:
      summary: Get a signed playback URL
      tags:
      - Background Music
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  track:
                    type: object
                  url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
                  mime_type:
                    type: string
                  bytes:
                    type: integer
                  duration_ms:
                    type: integer
                  asset_version:
                    type: string
                  loop_start_ms:
                    type: integer
                    nullable: true
                  loop_end_ms:
                    type: integer
                    nullable: true
  "/api/v1/background_music/favorites":
    get:
      summary: List background music favorites
      tags:
      - Background Music
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorites:
                    type: array
                    items:
                      type: object
  "/api/v1/background_music/favorites/{track_id}":
    parameters:
    - name: track_id
      in: path
      required: true
      schema:
        type: integer
    put:
      summary: Favorite a background music track
      tags:
      - Background Music
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
    delete:
      summary: Unfavorite a background music track
      tags:
      - Background Music
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: deleted
  "/api/v1/bible_versions":
    get:
      summary: list bible versions
      tags:
      - Bible Versions
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        code:
                          type: string
                        name:
                          type: string
                        full_name:
                          type: string
                        language:
                          type: string
                        description:
                          type: string
                        publisher:
                          type: string
                        year:
                          type: integer
                        is_recommended:
                          type: boolean
                        license:
                          type: string
                        created_at:
                          type: string
                          format: datetime
                  metadata:
                    type: object
                    properties:
                      total:
                        type: integer
                      last_updated:
                        type: string
                        nullable: true
  "/api/v1/calendar/today":
    get:
      summary: today calendar
      tags:
      - Calendar
      security:
      - bearer_auth: []
      - {}
      parameters:
      - name: Authorization
        in: header
        required: false
        description: Optional Firebase auth token (Bearer)
        schema:
          type: string
      - name: preferences
        in: query
        required: true
        description: 'User preferences as JSON string. Required fields: prayer_book_code.
          Example: {"prayer_book_code":"loc_2015","bible_version":"nvi"}'
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    example: 25/12/2025
                  fast_day:
                    type: boolean
                  fast_observance:
                    type: object
                    nullable: true
                    description: Prayer-book-specific fasting, abstinence, or penitential
                      observance.
                    required:
                    - kind
                    - status
                    - reason
                    - explanation
                    properties:
                      kind:
                        type: string
                        example: fast_and_abstinence
                      status:
                        type: string
                        example: appointed
                      reason:
                        type: string
                        example: ash_wednesday
                      explanation:
                        type: object
                        required:
                        - badge_label
                        - title
                        - subtitle
                        - description
                        properties:
                          badge_label:
                            type: string
                            example: Jejum e abstinência
                          title:
                            type: string
                            example: Dia de jejum e abstinência
                          subtitle:
                            type: string
                            example: Quarta-feira de Cinzas
                          description:
                            type: string
                            example: Este Livro de Oração estabelece esta observância
                              para o dia. Em geral, o jejum envolve limitar a alimentação
                              por um período, enquanto a abstinência envolve renunciar
                              a algo específico. As regras concretas variam conforme
                              o livro e a orientação da igreja local. Este dia marca
                              o início da Quaresma, tempo de preparação penitencial
                              para a Páscoa.
                  celebration:
                    type: object
                    nullable: true
                  celebrations:
                    type: array
                    description: All celebration candidates for the day, ordered by
                      precedence.
                    items:
                      type: object
                required:
                - date
                - fast_day
        '400':
          description: missing prayer_book_code
  "/api/v1/calendar/{year}/{month}/{day}":
    parameters:
    - name: year
      in: path
      description: year
      required: true
      schema:
        type: string
    - name: month
