  "/api/v1/completions":
    post:
      summary: Mark office as completed
      tags:
      - Completions
      description: Marks a Daily Office as completed for the authenticated user and
        updates streak
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        description: 'Firebase ID Token (format: Bearer <token>)'
        required: true
        schema:
          type: string
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Office completed successfully
                  completion:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      date_reference:
                        type: string
                        format: date
                        example: '2025-11-22'
                      office_type:
                        type: string
                        example: morning
                      prayer_book_id:
                        type: integer
                        example: 1
                        nullable: true
                      duration_seconds:
                        type: integer
                        example: 600
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
                        example: '2025-11-22T08:30:00Z'
                  current_streak:
                    type: integer
                    example: 8
                  longest_streak:
                    type: integer
                    example: 15
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '422':
          description: unprocessable entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Validation failed: User already completed this office
                      today'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                office_type:
                  type: string
                  enum:
                  - morning
                  - midday
                  - evening
                  - compline
                  example: morning
                date:
                  type: string
                  format: date
                  example: '2025-11-22'
                  description: 'Optional: date reference for the completion (defaults
                    to today)'
                duration_seconds:
                  type: integer
                  example: 600
                  description: 'Optional: duration in seconds spent on the office'
              required:
              - office_type
  "/api/v1/completions/{year}/{month}/{day}/{office_type}":
    parameters:
    - name: year
      in: path
      description: Year
      required: true
      example: 2025
      schema:
        type: integer
    - name: month
      in: path
      description: Month
      required: true
      example: 11
      schema:
        type: integer
    - name: day
      in: path
      description: Day
      required: true
      example: 22
      schema:
        type: integer
    - name: office_type
      in: path
      description: Office type
      required: true
      enum:
      - morning
      - midday
      - evening
      - compline
      example: morning
      schema:
        type: string
    get:
      summary: Check if office was completed
      tags:
      - Completions
      description: Checks if a specific Daily Office was completed for a given date
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        description: 'Firebase ID Token (format: Bearer <token>)'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Office completed
                  completion:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      created_at:
                        type: string
                        format: date-time
                        example: '2025-11-22T08:30:00Z'
        '404':
          description: not completed
          content:
            application/json:
              schema:
                type: object
  "/api/v1/completions/{id}":
    parameters:
    - name: id
      in: path
      description: Completion ID
      required: true
      schema:
        type: integer
    delete:
      summary: Remove completion
      tags:
      - Completions
      description: Removes a completion (in case of mistake) and recalculates streak
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        description: 'Firebase ID Token (format: Bearer <token>)'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Completion removed successfully
                  current_streak:
                    type: integer
                    example: 7
                  longest_streak:
                    type: integer
                    example: 15
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Completion not found
  "/api/v1/custom_rosary_prayers":
    get:
      summary: List the user's rosary prayers
      tags:
      - Custom Rosary Prayers
      description: 'Lists the authenticated user''s own prayers, blocks and steps
        included. Nothing is listed publicly here: approved prayers reach other people
        through the Strapi collection, not through this endpoint.'
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        description: 'Firebase ID Token (format: Bearer <token>)'
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Page size for updated clients (1-100)
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        description: Zero-based page offset for updated clients
        schema:
          type: integer
      - name: updated_after
        in: query
        format: date_time
        required: false
        description: Return records changed since this watermark
        schema:
          type: string
      responses:
        '200':
          description: updated clients can request only changed prayers
          content:
            application/json:
