                  photo_url:
                    type: string
                    example: https://example.com/photo.jpg
                    nullable: true
                  has_custom_avatar:
                    type: boolean
                    example: false
                  preferences:
                    type: object
                    properties:
                      version:
                        type: string
                        example: loc_2015
                      language:
                        type: string
                        example: pt-BR
                      bible_version:
                        type: string
                        example: nvi
                      lords_prayer_version:
                        type: string
                        example: traditional
                      creed_type:
                        type: string
                        example: apostles
                      confession_type:
                        type: string
                        example: long
                      notifications:
                        type: boolean
                        example: true
                      notifications_enabled:
                        type: boolean
                        example: true
                      streak_reminder_enabled:
                        type: boolean
                        example: true
                      streak_display_enabled:
                        type: boolean
                        example: true
                      prayer_times:
                        type: array
                        items:
                          type: object
                          properties:
                            office_id:
                              type: string
                              example: '1'
                            office_name:
                              type: string
                              example: Matutino
                            hour:
                              type: integer
                              example: 6
                            minute:
                              type: integer
                              example: 0
                            enabled:
                              type: boolean
                              example: true
                  timezone:
                    type: string
                    example: America/Sao_Paulo
                  country_code:
                    type: string
                    example: BR
                    nullable: true
                  current_streak:
                    type: integer
                    example: 7
                  longest_streak:
                    type: integer
                    example: 15
                  last_completed_office_at:
                    type: string
                    format: date-time
                    example: '2025-11-22T08:30:00Z'
                    nullable: true
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
    delete:
      summary: Delete user account
      tags:
      - Users
      description: Permanently deletes the user account and all associated data. This
        also removes the user from Firebase Authentication. This action is irreversible
        and complies with Apple App Store Guidelines 5.1.1(v).
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        description: 'Firebase ID Token (format: Bearer <token>)'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Account deleted successfully
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '502':
          description: bad gateway - firebase error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unable to delete account at this time
                  code:
                    type: string
                    example: FIREBASE_ACCOUNT_DELETE_REJECTED
                  request_id:
                    type: string
