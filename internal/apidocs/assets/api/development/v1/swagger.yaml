  "/api/v1/users/fcm_token":
    post:
      summary: Save FCM token for push notifications
      tags:
      - Users
      description: Saves or updates the FCM (Firebase Cloud Messaging) token for the
        authenticated user to enable push notifications
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        description: 'Firebase ID Token (format: Bearer <token>)'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Token FCM salvo com sucesso
                  fcm_token:
                    type: string
                    example: fK8x9y2ZqR3...
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '422':
          description: unprocessable entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: FCM token is required
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fcm_token:
                  type: string
                  example: fK8x9y2ZqR3...
                platform:
                  type: string
                  enum:
                  - android
                  - ios
                  - web
                  example: android
              required:
              - fcm_token
    delete:
      summary: Remove FCM token
      tags:
      - Users
      description: Removes the FCM token for the authenticated user (e.g., when logging
        out or disabling notifications)
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        description: 'Firebase ID Token (format: Bearer <token>)'
        required: true
        schema:
          type: string
      - name: fcm_token
        in: query
        description: FCM token to remove
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Token FCM removido com sucesso
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '422':
          description: unprocessable entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: FCM token is required
servers:
- url: http://localhost:3000
  description: Development server
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID Token. Obtenha através do Firebase Authentication no
        app Flutter.
    api_key_auth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key para consumidores externos. Não concede acesso de usuário
        ou administrador.
    app_identifier:
      type: apiKey
      in: header
      name: X-App-Internal-Id
      description: Identificador do app para leituras anônimas; não substitui autenticação
        sensível.
