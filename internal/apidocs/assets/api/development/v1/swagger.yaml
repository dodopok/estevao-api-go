      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    example: '2025-11-22'
                  office_type:
                    type: string
                    example: morning
                  season:
                    type: string
                    example: Tempo Comum
                    nullable: true
                  color:
                    type: string
                    example: verde
                    nullable: true
                  celebration:
                    type: object
                    nullable: true
                  saint:
                    type: object
                    nullable: true
                  modules:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: Sentença de Abertura
                        slug:
                          type: string
                          example: opening_sentence
                        lines:
                          type: array
                          items:
                            type: object
                            properties:
                              text:
                                type: string
                              type:
                                type: string
                                enum:
                                - heading
                                - subheading
                                - subtitle
                                - rubric
                                - leader
                                - congregation
                                - reader
                                - responsive
                                - reading_text
                                - all
                                - citation
                                - reference
                                - antiphon
                                - canticle
                                - creed
                                - prayer
                                - main_part
                                - text
                                - html
                                - spacer
                              slug:
                                type: string
                                nullable: true
                              verse_number:
                                type: integer
                                nullable: true
                        audio_url:
                          type: string
                          nullable: true
                          description: Present on reading modules when Bible audio
                            is available
                  metadata:
                    type: object
                    properties:
                      prayer_book_code:
                        type: string
                        example: loc_2015
                      prayer_book_name:
                        type: string
                        example: Livro de Oração Comum - IEAB 2015
                      bible_version:
                        type: string
                        example: nvi
                      language:
                        type: string
                        example: pt-BR
                      seed:
                        type: integer
                        example: 1234567890
                        description: Seed used for deterministic randomization (for
                          sharing)
                  features:
                    type: object
                    properties:
                      daily_office_audio:
                        type: boolean
                        description: Whether the authenticated user may receive Daily
                          Office audio
                  audio_track:
                    type: object
                    nullable: true
                    description: Audio timeline for premium readers using pre-generated
                      clips
                    properties:
                      provider:
                        type: string
                        example: openai
                      model:
                        type: string
                        example: gpt-4o-mini-tts
                      voice:
                        type: string
                        example: cedar
                      language:
                        type: string
                        example: pt-BR
                      duration:
                        type: number
                        format: float
                      characters:
                        type: integer
                      missing:
                        type: integer
                      complete:
                        type: boolean
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - clip
                              - silence
                            line_id:
                              type: string
                              nullable: true
                            section:
                              type: string
                              nullable: true
                            type:
                              type: string
                              nullable: true
                            is_navigation_target:
                              type: boolean
                              description: Whether manual next/previous navigation
                                may stop on this entry
                            url:
                              type: string
                              nullable: true
                            duration:
                              type: number
                              format: float
                            start_time:
