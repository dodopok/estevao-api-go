  "/api/v1/notifications/send":
    post:
      summary: Send notifications to specific users
      tags:
      - Notifications
      description: Sends push notifications to specific users (Admin only)
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        description: 'Firebase ID Token (format: Bearer <token>) - Must be admin user'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Notificações enviadas
                  sent_count:
                    type: integer
                    example: 3
                  failed_count:
                    type: integer
                    example: 0
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized - Admin access required
        '422':
          description: unprocessable entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: user_ids, title, and body are required
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_ids:
                  type: array
                  items:
                    type: integer
                  example:
                  - 1
                  - 2
                  - 3
                title:
                  type: string
                  example: Título da notificação
                body:
                  type: string
                  example: Corpo da notificação
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      example: new_feature
                    url:
                      type: string
                      example: "/path/to/feature"
              required:
              - user_ids
              - title
              - body
