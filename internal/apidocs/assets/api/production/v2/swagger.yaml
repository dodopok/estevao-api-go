---
openapi: 3.0.1
info:
  title: Estevão API para desenvolvedores
  version: v2
  description: Catálogo litúrgico somente leitura. Cada requisição autenticada conta
    como uma chamada; X-Request-Cost estima trabalho no servidor e não altera a cota.
paths:
  "/api/v2/days":
    get:
      summary: List liturgical days
      tags:
      - Days
      parameters:
      - name: book
        in: query
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: year
        in: query
        required: false
        schema:
          type: string
          pattern: "^[0-9]{4}$"
      - name: include
        in: query
        required: false
        description: 'Comma-separated: readings, readings.text, readings.morning,
          readings.evening, readings.alternatives, collect, collect.text, celebrations,
          explanation. Maximum 31 days with readings.text or explanation; otherwise
          366.'
        schema:
          type: string
      - name: service
        in: query
        required: false
        schema:
          type: string
          enum:
          - daily
          - eucharist
          - morning
          - evening
        description: Explanation service when include=explanation; defaults to daily.
      - name: fields[day]
        in: query
        required: false
        schema:
          type: string
      - name: fields[reading]
        in: query
        required: false
        schema:
          type: string
      - name: fields[collect]
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Days in the requested range
          headers:
            X-Request-Cost:
              schema:
                type: integer
              description: Relative server work; quota counts one call
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Day"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        '304':
          description: Representation unchanged
          headers:
            X-Request-Cost:
              schema:
                type: integer
        '400':
          description: Invalid or missing range, include, fields, or book
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '401':
          description: Missing or unusable API key
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '422':
          description: Unknown prayer book
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/v2/days/{date}":
    get:
      summary: Get one liturgical day
      tags:
      - Days
      parameters:
      - name: date
        in: path
        required: true
        description: ISO date (YYYY-MM-DD) or today
        schema:
          type: string
      - name: book
        in: query
        required: true
        schema:
          type: string
      - name: include
        in: query
        required: false
        description: 'Comma-separated: readings, readings.text, readings.morning,
          readings.evening, readings.alternatives, collect, collect.text, celebrations,
          explanation'
        schema:
          type: string
      - name: service
        in: query
        required: false
        schema:
          type: string
          enum:
          - daily
          - eucharist
          - morning
          - evening
        description: Explanation service when include=explanation; defaults to daily.
      - name: fields[day]
        in: query
        required: false
        schema:
          type: string
      - name: fields[reading]
        in: query
        required: false
        schema:
          type: string
      - name: fields[collect]
        in: query
        required: false
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Liturgical day
          headers:
            ETag:
              schema:
                type: string
            X-Request-Cost:
              schema:
                type: integer
              description: Relative server work; quota counts one call
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    "$ref": "#/components/schemas/Day"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        '304':
          description: Representation unchanged
          headers:
            X-Request-Cost:
              schema:
                type: integer
        '400':
          description: Invalid date, include, fields, or missing book
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '401':
          description: Missing or unusable API key
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '422':
          description: Unknown prayer book
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/v2/liturgical-explanations/{date}":
    get:
      summary: Explain liturgical decisions for a date
      tags:
      - Liturgical explanations
      parameters:
      - name: date
        in: path
        required: true
        description: ISO date (YYYY-MM-DD) or today
        schema:
          type: string
      - name: book
        in: query
        required: true
        schema:
          type: string
      - name: service
        in: query
        required: false
        schema:
          type: string
          enum:
          - daily
          - eucharist
          - morning
          - evening
        description: Reading service to explain; defaults to daily.
      - name: bible
        in: query
        required: false
        schema:
          type: string
      - name: psalter
        in: query
        required: false
        schema:
          type: string
      - name: lectionary
        in: query
        required: false
        schema:
          type: string
      - name: reading_type
        in: query
        required: false
        schema:
          type: string
      - name: lang
        in: query
        required: false
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Structured explanation and provenance for the day
          headers:
            ETag:
              schema:
                type: string
            X-Request-Cost:
              schema:
                type: integer
              description: Relative server work; quota counts one call
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    "$ref": "#/components/schemas/LiturgicalExplanation"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        '304':
          description: Representation unchanged
          headers:
            X-Request-Cost:
              schema:
                type: integer
        '400':
          description: Invalid date or service, or missing book
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '401':
          description: Missing or unusable API key
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '422':
          description: Unknown prayer book
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/v2/days/{date}/readings":
    get:
      summary: Get readings for a service
      tags:
      - Readings
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
      - name: book
        in: query
        required: true
        schema:
          type: string
      - name: service
        in: query
        required: false
        schema:
          type: string
          enum:
          - daily
          - eucharist
          - morning
          - evening
          - all
      - name: include
        in: query
        required: false
        description: 'Comma-separated: text, alternatives'
        schema:
          type: string
      - name: text_format
        in: query
        required: false
        schema:
          type: string
          enum:
          - verses
          - plain
          - markdown
      - name: fields[reading]
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Reading references and optional text
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    required:
                    - date
                    - service
                    - cycle
                    properties:
                      date:
                        type: string
                        format: date
                      service:
                        type: string
                      cycle:
                        type: string
                        nullable: true
                      readings:
                        type: array
                        items:
                          "$ref": "#/components/schemas/Reading"
                      services:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            "$ref": "#/components/schemas/Reading"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        '304':
          description: Representation unchanged
          headers:
            X-Request-Cost:
              schema:
                type: integer
        '400':
          description: Invalid date, service, include, or fields
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '401':
          description: Missing or unusable API key
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '422':
          description: Unknown prayer book
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/v2/collects/{date}":
    get:
      summary: Get collects for a date
      tags:
      - Collects
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
      - name: book
        in: query
        required: true
        schema:
          type: string
      - name: include
        in: query
        required: false
        schema:
          type: string
          enum:
          - text
      - name: fields[collect]
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Collects with optional prayer text
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    required:
                    - date
                    - collects
                    properties:
                      date:
                        type: string
                        format: date
                      collects:
                        type: array
                        items:
                          "$ref": "#/components/schemas/Collect"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        '304':
          description: Representation unchanged
          headers:
            X-Request-Cost:
              schema:
                type: integer
        '400':
          description: Invalid date, include, or fields
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '401':
          description: Missing or unusable API key
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '422':
          description: Unknown prayer book
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/v2/passages":
    get:
      summary: Get Bible passage text
      tags:
      - Passages
      parameters:
      - name: ref
        in: query
        required: true
        description: Bible reference, e.g. João 3:16
        schema:
          type: string
      - name: bible
        in: query
        required: true
        schema:
          type: string
      - name: text_format
        in: query
        required: false
        schema:
          type: string
          enum:
          - verses
          - plain
          - markdown
      responses:
        '200':
          description: Passage text
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    required:
                    - reference
                    - bible
                    properties:
                      reference:
                        type: string
                      bible:
                        type: string
                      text:
                        "$ref": "#/components/schemas/ReadingText"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        '304':
          description: Representation unchanged
          headers:
            X-Request-Cost:
              schema:
                type: integer
        '400':
          description: Missing reference or Bible version, or invalid format
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '401':
          description: Missing or unusable API key
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: No text for this reference and Bible version
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '422':
          description: Unknown Bible version
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/v2/prayer-books":
