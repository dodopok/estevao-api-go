      - name: fields[prayer_book]
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Prayer book catalog
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/PrayerBook"
                  meta:
                    "$ref": "#/components/schemas/Meta"
  "/api/v2/prayer-books/{code}":
    parameters:
    - name: code
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Get prayer book details and capabilities
      tags:
      - Catalogs
      responses:
        '200':
          description: Prayer book details
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    "$ref": "#/components/schemas/PrayerBook"
                  meta:
                    "$ref": "#/components/schemas/Meta"
  "/api/v2/prayer-books/{code}/preferences":
    parameters:
    - name: code
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Get supported preferences for a prayer book
      tags:
      - Catalogs
      responses:
        '200':
          description: Prayer book preference definitions
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    "$ref": "#/components/schemas/PrayerBookPreferences"
                  meta:
                    "$ref": "#/components/schemas/Meta"
  "/api/v2/bible-versions":
    get:
      summary: List Bible versions
      tags:
      - Catalogs
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
      - name: fields[bible_version]
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Bible version catalog
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/BibleVersion"
                  meta:
                    "$ref": "#/components/schemas/Meta"
  "/api/v2/celebrations":
    get:
      summary: Search and list celebrations
      tags:
      - Celebrations
      parameters:
      - name: book
        in: query
        required: true
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: month
        in: query
        required: false
        schema:
          type: integer
      - name: day
        in: query
        required: false
        schema:
          type: integer
      - name: year
        in: query
        required: false
        schema:
          type: string
      - name: movable
        in: query
        required: false
        schema:
          type: boolean
      - name: limit
        in: query
        required: false
        maximum: 100
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: fields[celebration]
        in: query
        required: false
        schema:
          type: string
      - name: fields[celebration_type]
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Celebration page
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                - links
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Celebration"
                  meta:
                    "$ref": "#/components/schemas/Meta"
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                      next:
                        type: string
  "/api/v2/celebrations/types":
    get:
      summary: List celebration types
      tags:
      - Celebrations
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
      - name: fields[celebration_type]
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Celebration types
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        value:
                          type: string
                        name:
                          type: string
                  meta:
                    "$ref": "#/components/schemas/Meta"
  "/api/v2/celebrations/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Get celebration details
      tags:
      - Celebrations
      parameters:
      - name: book
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Celebration detail
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    "$ref": "#/components/schemas/Celebration"
                  meta:
                    "$ref": "#/components/schemas/Meta"
  "/api/v2/years/{year}":
    parameters:
    - name: year
      in: path
      required: true
      pattern: "^[0-9]{4}$"
      schema:
        type: string
    get:
      summary: Get annual overview
      tags:
      - Years
      parameters:
      - name: book
        in: query
        required: true
        schema:
          type: string
      - name: fields[annual_overview]
        in: query
        required: false
        schema:
          type: string
      - name: fields[season]
        in: query
        required: false
        schema:
          type: string
      - name: fields[key_date]
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Annual overview
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    additionalProperties: true
                  meta:
                    "$ref": "#/components/schemas/Meta"
  "/api/v2/years/{year}/seasons":
    parameters:
    - name: year
      in: path
      required: true
      pattern: "^[0-9]{4}$"
      schema:
        type: string
    get:
      summary: List seasons in a year
      tags:
      - Years
      parameters:
      - name: book
        in: query
        required: true
        schema:
          type: string
      - name: fields[season]
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Liturgical seasons
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    additionalProperties: true
                  meta:
                    "$ref": "#/components/schemas/Meta"
  "/api/v2/years/{year}/key-dates":
    parameters:
    - name: year
      in: path
      required: true
      pattern: "^[0-9]{4}$"
      schema:
        type: string
    get:
      summary: List key dates in a year
      tags:
      - Years
      parameters:
      - name: book
        in: query
        required: true
        schema:
          type: string
      - name: fields[key_date]
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Key dates
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    additionalProperties: true
                  meta:
                    "$ref": "#/components/schemas/Meta"
  "/api/v2/years/{year}/lectionary-cycle":
    parameters:
    - name: year
      in: path
      required: true
      pattern: "^[0-9]{4}$"
      schema:
        type: string
    get:
      summary: Get lectionary cycles for a year
      tags:
      - Years
      parameters:
      - name: book
        in: query
        required: true
        schema:
          type: string
      - name: fields[lectionary_cycle]
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Lectionary cycles
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      year:
                        type: integer
                      sunday:
                        type: string
                      weekday:
                        type: string
                  meta:
                    "$ref": "#/components/schemas/Meta"
servers:
- url: https://api.caminhoanglicano.com.br
  description: Production server
security:
- api_key_auth: []
components:
  securitySchemes:
    api_key_auth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        documentation_url:
          type: string
          format: uri
        request_id:
          type: string
    Reading:
      type: object
      required:
      - slot
      - reference
      properties:
        slot:
          type: string
        reference:
          type: string
        title:
          type: string
        alternatives:
          type: array
          items:
            type: string
        text:
          nullable: true
          oneOf:
          - "$ref": "#/components/schemas/ReadingText"
    ReadingText:
      type: object
      required:
      - format
      - bible
      properties:
        format:
          type: string
          enum:
          - verses
          - plain
          - markdown
        bible:
          type: string
        content:
          type: string
        verses:
          type: array
          items:
            type: object
            properties:
              number:
                type: integer
              text:
                type: string
    Collect:
      type: object
      properties:
        title:
          type: string
        subtitle:
          type: string
        kind:
          type: string
        sunday_reference:
          type: string
        celebration_id:
          type: integer
        text:
          type: string
        preface:
          type: string
    ExplanationPresentation:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
    ExplanationReason:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    ExplanationOccurrence:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        type:
          type: string
        type_label:
          type: string
        date:
          type: string
          format: date
        selected:
          type: boolean
        discarded_reason:
          "$ref": "#/components/schemas/ExplanationReason"
      additionalProperties: true
    LiturgicalExplanation:
      type: object
      required:
      - date
      - prayer_book_code
      - locale
      - calendar
      - celebration
      - color
      - transfers
      - reading_guide
      - readings
      - partial
      properties:
        date:
          type: string
          format: date
        prayer_book_code:
          type: string
        locale:
          type: string
        presentation:
